<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

  <title>Unity Web Player | Poker</title>

  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
</head>

<body>

  <div id="unity-container" class="unity-desktop">

    <canvas
      id="unity-canvas"
      width="960"
      height="600"
      tabindex="-1">
    </canvas>

    <div id="unity-loading-bar">

      <div id="unity-logo"></div>

      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>

    </div>

    <div id="unity-warning"></div>

  </div>


  <script>

    // ============================================================
    // UNITY CANVAS
    // ============================================================

    var canvas = document.querySelector("#unity-canvas");


    // ============================================================
    // QUERY PARAMETER
    // ============================================================

    var lastQueryValue = null;


    // Called from Unity when it sends data back to the browser.
    window.handleUnityData = function (data)
    {
        console.log("Received data from Unity:", data);
    };


    function getQueryValue()
    {
        const urlParams = new URLSearchParams(window.location.search);

        const queryValue = urlParams.get("auth") || "";

        console.log("Current auth:", queryValue);

        return queryValue;
    }


    // ============================================================
    // CHECK QUERY PARAMETER CHANGE
    // ============================================================

    function checkQueryChange(unityInstance)
    {
        const currentQueryValue = getQueryValue();


        // Only send data when query value changes
        if (currentQueryValue !== lastQueryValue)
        {
            lastQueryValue = currentQueryValue;

            console.log(
                "Query value changed:",
                currentQueryValue
            );


            // Send query value to Unity
            unityInstance.SendMessage(
                "MGPGameManager",
                "CallBackMethod",
                currentQueryValue
            );
        }
    }


    // ============================================================
    // UNITY BANNER
    // ============================================================

    function unityShowBanner(msg, type)
    {
        var warningBanner =
            document.querySelector("#unity-warning");


        function updateBannerVisibility()
        {
            warningBanner.style.display =
                warningBanner.children.length
                    ? "block"
                    : "none";
        }


        var div =
            document.createElement("div");


        div.innerHTML = msg;


        warningBanner.appendChild(div);


        if (type == "error")
        {
            div.style =
                "background: red; padding: 10px;";
        }
        else
        {
            if (type == "warning")
            {
                div.style =
                    "background: yellow; padding: 10px;";
            }


            setTimeout(function()
            {
                warningBanner.removeChild(div);

                updateBannerVisibility();

            }, 5000);
        }


        updateBannerVisibility();
    }


    // ============================================================
    // UNITY BUILD CONFIG
    // ============================================================

    var buildUrl = "Build";


    var loaderUrl =
        buildUrl + "/webgl-poker.loader.js";


    var config =
    {
        arguments: [],

        dataUrl:
            buildUrl + "/webgl-poker.data",

        frameworkUrl:
            buildUrl + "/webgl-poker.framework.js",

        codeUrl:
            buildUrl + "/webgl-poker.wasm",

        streamingAssetsUrl:
            "StreamingAssets",

        companyName:
            "Xogo",

        productName:
            "Poker",

        productVersion:
            "0.1",

        showBanner:
            unityShowBanner
    };


    // ============================================================
    // MOBILE
    // ============================================================

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent))
    {
        var meta =
            document.createElement("meta");


        meta.name = "viewport";


        meta.content =
            "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";


        document
            .getElementsByTagName("head")[0]
            .appendChild(meta);


        document
            .querySelector("#unity-container")
            .className = "unity-mobile";


        canvas.className = "unity-mobile";
    }
    else
    {
        canvas.style.width = "100vw";

        canvas.style.height = "100vh";
    }


    // ============================================================
    // LOADING BAR
    // ============================================================

    document
        .querySelector("#unity-loading-bar")
        .style.display = "block";


    // ============================================================
    // LOAD UNITY
    // ============================================================

    var script =
        document.createElement("script");


    script.src = loaderUrl;


    script.onload = () =>
    {
        createUnityInstance(
            canvas,
            config,

            (progress) =>
            {
                document
                    .querySelector("#unity-progress-bar-full")
                    .style.width =
                    100 * progress + "%";
            }

        ).then((unityInstance) =>
        {
            document
                .querySelector("#unity-loading-bar")
                .style.display = "none";


            // ====================================================
            // INITIAL QUERY DATA
            // ====================================================

            checkQueryChange(unityInstance);


            // ====================================================
            // CHECK URL EVERY 500ms
            // ====================================================

            setInterval(() =>
            {
                checkQueryChange(unityInstance);

            }, 500);


        }).catch((message) =>
        {
            alert(message);
        });
    };


    document.body.appendChild(script);

  </script>

</body>
</html>
